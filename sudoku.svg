<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="100%" height="100%">
  <foreignObject width="100%" height="100%"  requiredExtensions="http://www.w3.org/1999/xhtml">
  <html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="stylesheet" href="./styles.css" />

  <body>
  <div class="page">
  
    <header class="masthead">
      <h1>Sudoku</h1>
      <div class="masthead-rule"></div>
      <div class="masthead-rule thin"></div>
    </header>
    <div class="dateline" id="dateline"></div>
  
    <div class="refresh-banner" id="refreshBanner">
      Today's puzzle is ready.
      <button id="refreshBtn" type="button">Load it</button>
    </div>
  
    <div class="tabs" role="tablist" aria-label="Difficulty">
      <button class="tab" role="tab" data-diff="easy" type="button">Easy</button>
      <button class="tab" role="tab" data-diff="medium" type="button">Medium</button>
      <button class="tab" role="tab" data-diff="hard" type="button">Hard</button>
    </div>
  
    <div class="status-row">
      <span id="timer">0:00</span>
      <span class="best" id="bestTime"></span>
    </div>
  
    <div id="toast" role="status" aria-live="polite"></div>
  
    <div class="board-wrap">
      <div class="grid" id="grid" role="group" aria-label="Sudoku puzzle grid"></div>
      <div class="stamp" id="stamp"><div class="stamp-inner" id="stampText">Solved</div></div>
    </div>
  
    <div class="numpad" id="numpad"></div>
  
    <div class="controls">
      <button class="ctrl-btn" id="notesBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        Notes
      </button>
      <button class="ctrl-btn" id="undoBtn" type="button">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7"/></svg>
        Undo
      </button>
      <button class="ctrl-btn" id="eraseBtn" type="button">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-6-6a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l7 7a2 2 0 0 1 0 2.8L14 20"/></svg>
        Erase
      </button>
      <button class="ctrl-btn" id="checkBtn" type="button">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        Check
      </button>
    </div>
  
    <div class="footer">
      <button class="reveal-link" id="revealBtn" type="button">Reveal solution</button>
      <div class="countdown" id="countdown"></div>
    </div>
  
    <details class="devtools">
      <summary>Powered by Stuffnest</summary>
      <div class="row">
        <input type="date" id="previewDate">
        <button id="previewBtn" type="button">Load</button>
        <button id="previewToday" type="button">Today</button>
      </div>
    </details> 
  
  </div>
  

  
  <script src="./script.js"></script>
  </body>
  </html>
  </foreignObject>
</svg>
 
